<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Liquid Glass Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050508;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease}
#hud{position:fixed;top:16px;left:16px;z-index:10;pointer-events:none}
#hud .tag{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4)}
#hud .sub{font-size:9px;letter-spacing:.1em;color:rgba(255,255,255,.25);margin-top:4px}
#fps{position:fixed;top:16px;right:16px;z-index:10;font-size:11px;font-family:monospace;
  color:rgba(255,255,255,.5);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:4px;pointer-events:none}
#mode{position:fixed;bottom:16px;left:16px;z-index:10;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(255,255,255,.3);pointer-events:none}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;
  color:rgba(255,255,255,.3);pointer-events:none;transition:opacity 2s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="tag">Liquid Glass / Refraction</div>
  <div class="sub">IOR 1.52 · Fresnel · Mirror Scene</div>
</div>
<div id="fps">-- fps</div>
<div id="mode">DESKTOP</div>
<div id="hint">Move cursor / touch to interact</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

var hintEl = document.getElementById('hint');
if (typeof THREE === 'undefined') {
  if (hintEl) hintEl.textContent = 'Three.js load failed';
  return;
}

var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
var reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion:reduce)').matches : false;
var DPR = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 2);
var RT_BASE = isMobile ? 256 : 512;

var canvas = document.getElementById('c');
var fpsEl = document.getElementById('fps');
var modeEl = document.getElementById('mode');
modeEl.textContent = isMobile ? 'MOBILE' : 'DESKTOP';
setTimeout(function(){ hintEl.style.opacity = '0'; }, 4000);

var renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: !isMobile,
    alpha: false
  });
} catch(e) {
  if (hintEl) hintEl.textContent = 'WebGL not available';
  return;
}

renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth || 1, window.innerHeight || 1, false);
renderer.setClearColor(0x050508, 1);
renderer.outputEncoding = THREE.LinearEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
var camera = new THREE.PerspectiveCamera(45, (window.innerWidth||1)/(window.innerHeight||1), 0.1, 100);
camera.position.z = 5;

var worldScene = new THREE.Scene();
worldScene.background = new THREE.Color(0x050508);
var worldCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
worldCam.position.z = 5;

/* ── Background ── */
var bgU = {
  uTime: { value: 0 }
};
var bgMat = new THREE.ShaderMaterial({
  uniforms: bgU,
  vertexShader: [
    'varying vec2 vUv;',
    'void main(){',
    '  vUv = uv;',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform float uTime;',
    'varying vec2 vUv;',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec3 col = vec3(0.008, 0.008, 0.015);',
    '  vec2 g = abs(fract(uv * vec2(24.0, 24.0)) - 0.5);',
    '  col += (1.0 - smoothstep(0.0, 0.04, min(g.x, g.y))) * vec3(0.012, 0.02, 0.045);',
    '  vec2 p1 = vec2(0.3 + sin(uTime * 0.35) * 0.3, 0.5 + cos(uTime * 0.25) * 0.25);',
    '  col += exp(-length(uv - p1) * 4.5) * vec3(0.035, 0.08, 0.25);',
    '  vec2 p2 = vec2(0.7 + cos(uTime * 0.28) * 0.22, 0.35 + sin(uTime * 0.45) * 0.18);',
    '  col += exp(-length(uv - p2) * 5.5) * vec3(0.02, 0.045, 0.13);',
    '  vec2 p3 = vec2(0.5 + sin(uTime * 0.15) * 0.4, 0.6 + cos(uTime * 0.2) * 0.3);',
    '  col += exp(-length(uv - p3) * 7.0) * vec3(0.015, 0.03, 0.09);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
});
var bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), bgMat);
bgPlane.position.z = -1;
worldScene.add(bgPlane);

/* ── H Logo ── */
var hGroup = new THREE.Group();
var hMat = new THREE.MeshStandardMaterial({
  color: 0x2255ff,
  metalness: 0.8,
  roughness: 0.2,
  emissive: 0x0a1a44,
  emissiveIntensity: 0.4
});
var barV = new THREE.BoxGeometry(0.16, 0.9, 0.16);
var barH = new THREE.BoxGeometry(0.6, 0.13, 0.16);
var lMesh = new THREE.Mesh(barV, hMat);
lMesh.position.x = -0.22;
var rMesh = new THREE.Mesh(barV, hMat);
rMesh.position.x = 0.22;
var hMesh = new THREE.Mesh(barH, hMat);
hGroup.add(lMesh, rMesh, hMesh);
worldScene.add(hGroup);

/* ── Lights ── */
worldScene.add(new THREE.AmbientLight(0x333355, 0.6));
var wl1 = new THREE.PointLight(0x4488ff, 2, 15);
wl1.position.set(2, 2, 3);
var wl2 = new THREE.PointLight(0x2244aa, 1.5, 15);
wl2.position.set(-2, -1, 3);
var wl3 = new THREE.PointLight(0x6699ff, 1, 12);
wl3.position.set(0, 1.5, 2);
worldScene.add(wl1, wl2, wl3);

/* ── Render Target ── */
function getRTSize() {
  var w = window.innerWidth || 1;
  var h = window.innerHeight || 1;
  var a = w / h;
  if (a >= 1) {
    return { w: Math.max(1, Math.floor(RT_BASE * a)), h: RT_BASE };
  }
  return { w: RT_BASE, h: Math.max(1, Math.floor(RT_BASE / a)) };
}

var sz = getRTSize();
var rt = new THREE.WebGLRenderTarget(sz.w, sz.h, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  depthBuffer: true,
  stencilBuffer: false
});
rt.texture.wrapS = THREE.ClampToEdgeWrapping;
rt.texture.wrapT = THREE.ClampToEdgeWrapping;
rt.texture.generateMipmaps = false;
worldCam.aspect = sz.w / sz.h;
worldCam.updateProjectionMatrix();

/* ── Glass Shader ── */
var gU = {
  uBg: { value: rt.texture },
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uIOR: { value: 1.52 },
  uAlpha: { value: 0.0 },
  uAspect: { value: sz.w / sz.h }
};

var VERT = [
  'varying vec2 vUv;',
  'varying vec2 vScreenUv;',
  'varying vec3 vN;',
  'varying vec3 vV;',
  'void main(){',
  '  vUv = uv;',
  '  vN = normalize(normalMatrix * normal);',
  '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
  '  vV = normalize(-mv.xyz);',
  '  vec4 clip = projectionMatrix * mv;',
  '  vScreenUv = (clip.xy / clip.w) * 0.5 + 0.5;',
  '  gl_Position = clip;',
  '}'
].join('\n');

var FRAG = [
  'uniform sampler2D uBg;',
  'uniform float uTime;',
  'uniform vec2 uMouse;',
  'uniform float uIOR;',
  'uniform float uAlpha;',
  'uniform float uAspect;',
  'varying vec2 vUv;',
  'varying vec2 vScreenUv;',
  'varying vec3 vN;',
  'varying vec3 vV;',
  'void main(){',
  '  vec2 localUv = vUv;',
  '  vec2 screenUv = vScreenUv;',
  '  float t = uTime;',
  '',
  '  float nx = sin(localUv.x * 8.0 + t * 1.5) * 0.15 + sin(localUv.y * 6.0 - t * 1.2) * 0.10;',
  '  float ny = cos(localUv.y * 7.0 + t * 1.3) * 0.15 + cos(localUv.x * 5.0 + t * 0.9) * 0.10;',
  '',
  '  vec2 mo = vec2((screenUv.x - uMouse.x) * uAspect, screenUv.y - uMouse.y);',
  '  float md = max(length(mo), 0.001);',
  '  float mw = sin(md * 25.0 - t * 4.0) * exp(-md * 6.0) * 0.3;',
  '  nx += (mo.x / md) * mw;',
  '  ny += (mo.y / md) * mw;',
  '',
  '  vec3 N = normalize(vec3(nx, ny, 1.0));',
  '  vec3 V = normalize(vV);',
  '',
  '  float cosI = clamp(dot(V, N), 0.0, 1.0);',
  '  float sin2I = 1.0 - cosI * cosI;',
  '  float eta = 1.0 / uIOR;',
  '  float sin2T = eta * eta * sin2I;',
  '',
  '  vec2 ro;',
  '  if (sin2T > 1.0) {',
  '    vec3 R = reflect(-V, N);',
  '    ro = vec2(R.x * uAspect, R.y) * 0.08;',
  '  } else {',
  '    float cosT = sqrt(max(0.0, 1.0 - sin2T));',
  '    vec3 I = -V;',
  '    vec3 T = eta * I + (eta * cosI - cosT) * N;',
  '    ro = vec2(T.x * uAspect, T.y) * 0.06;',
  '  }',
  '  ro += vec2(N.x * uAspect, N.y) * 0.03;',
  '',
  '  vec2 suv = clamp(screenUv + ro, vec2(0.0), vec2(1.0));',
  '  vec3 rc = texture2D(uBg, suv).rgb;',
  '',
  '  float fr = pow(1.0 - cosI, 3.0);',
  '  vec3 tint = vec3(0.03, 0.055, 0.11);',
  '  vec3 fc = rc * 0.85 + tint + fr * vec3(0.18, 0.35, 0.85) * 0.4;',
  '',
  '  float ex = smoothstep(0.0, 0.08, localUv.x) * (1.0 - smoothstep(0.92, 1.0, localUv.x));',
  '  float ey = smoothstep(0.0, 0.08, localUv.y) * (1.0 - smoothstep(0.92, 1.0, localUv.y));',
  '  fc += (1.0 - ex * ey) * vec3(0.04, 0.08, 0.18) * 0.3;',
  '',
  '  vec3 L = vec3(0.5, 0.5, 1.0);',
  '  L = L / length(L);',
  '  vec3 Hv = L + V;',
  '  Hv = Hv / length(Hv);',
  '  float sp = pow(max(0.0, dot(N, Hv)), 32.0);',
  '  fc += sp * vec3(0.08, 0.12, 0.22);',
  '',
  '  fc = clamp(fc, vec3(0.0), vec3(1.0));',
  '  fc = pow(fc, vec3(1.0 / 2.2));',
  '  gl_FragColor = vec4(fc, uAlpha);',
  '}'
].join('\n');

var glassMat = new THREE.ShaderMaterial({
  uniforms: gU,
  vertexShader: VERT,
  fragmentShader: FRAG,
  transparent: true,
  depthWrite: false,
  side: THREE.FrontSide
});
var glass = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.0, 64, 64), glassMat);
glass.position.z = 0.5;
glass.renderOrder = 1;
scene.add(glass);

/* ── Input ── */
var mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5;
function onMove(x, y) {
  var w = window.innerWidth || 1;
  var h = window.innerHeight || 1;
  tmx = Math.min(1, Math.max(0, x / w));
  tmy = Math.min(1, Math.max(0, 1 - y / h));
}
window.addEventListener('mousemove', function(e) {
  onMove(e.clientX, e.clientY);
});
window.addEventListener('touchstart', function(e) {
  if (e.touches.length) onMove(e.touches.clientX, e.touches.clientY);
}, { passive: true });
window.addEventListener('touchmove', function(e) {
  if (e.touches.length) onMove(e.touches.clientX, e.touches.clientY);
}, { passive: true });

/* ── Resize ── */
function updateSize() {
  var w = window.innerWidth || 1;
  var h = window.innerHeight || 1;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(DPR);
  renderer.setSize(w, h, false);
  sz = getRTSize();
  rt.setSize(sz.w, sz.h);
  worldCam.aspect = sz.w / sz.h;
  worldCam.updateProjectionMatrix();
  gU.uAspect.value = sz.w / sz.h;
}
window.addEventListener('resize', updateSize);
updateSize();

/* ── Loop ── */
var clock = new THREE.Clock();
var frames = 0;
var lastFps = performance.now();

function tick() {
  requestAnimationFrame(tick);
  var t = clock.getElapsedTime();
  frames++;
  var now = performance.now();
  if (now - lastFps >= 1000) {
    fpsEl.textContent = frames + ' fps';
    frames = 0;
    lastFps = now;
  }

  mx += (tmx - mx) * 0.08;
  my += (tmy - my) * 0.08;
  gU.uMouse.value.set(mx, my);

  bgU.uTime.value = reducedMotion ? 0 : t;
  gU.uTime.value = reducedMotion ? 0 : t;

  renderer.setRenderTarget(rt);
  renderer.render(worldScene, worldCam);
  renderer.setRenderTarget(null);

  if (!reducedMotion) {
    hGroup.rotation.y = Math.sin(t * 0.5) * 0.3 + (mx - 0.5) * 0.6;
    hGroup.rotation.x = Math.cos(t * 0.3) * 0.15 + (my - 0.5) * 0.35;
    hGroup.position.y = Math.sin(t * 0.8) * 0.05;
    glass.rotation.y = (mx - 0.5) * 0.1;
    glass.rotation.x = (my - 0.5) * (-0.1);
    wl1.position.x = 2 + Math.sin(t * 0.7);
    wl1.position.y = 2 + Math.cos(t * 0.5);
  }

  if (gU.uAlpha.value < 0.95) {
    gU.uAlpha.value = Math.min(0.95, gU.uAlpha.value + 0.008);
  }

  renderer.render(scene, camera);
}
tick();

requestAnimationFrame(function() {
  canvas.style.opacity = '1';
});
})();
</script>
</body>
</html>
